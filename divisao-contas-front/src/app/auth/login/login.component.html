<div class="login-bg">
  <div class="login-title">DIVISÃO DE CONTAS</div>

  <mat-card class="login-card">
    <div class="card-topbar"></div>

    <mat-card-content class="card-content">
      <h2 class="card-heading">Entrar na sua conta</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Nome de usuário</mat-label>
          <input matInput formControlName="usuario" autocomplete="username" />
          <mat-error *ngIf="form.get('usuario')?.hasError('required') && form.get('usuario')?.touched">
            Usuário é obrigatório
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            formControlName="senha"
            autocomplete="current-password"
          />
          <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
            <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>

          <mat-error *ngIf="form.get('senha')?.hasError('required') && form.get('senha')?.touched">
            Senha é obrigatória
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button mat-raised-button color="primary" class="btn" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading">Entrando...</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
