<div class="page">
  <div class="page__container">
    <div class="card card-primary">
      <div class="card-header">Consultar Pagamentos</div>
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="pesquisar()">
          <div class="filter-row">
            <div class="filter-field">
              <mat-form-field appearance="outline" class="form-field">
                <input
                  matInput
                  [matDatepicker]="pickerInicio"
                  id="dataInicio"
                  formControlName="dataInicio"
                  autocomplete="off"
                  placeholder="Selecione a data inicial"
                />
                <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
                <mat-datepicker #pickerInicio></mat-datepicker>
              </mat-form-field>
            </div>

            <div class="filter-field">
              <mat-form-field appearance="outline" class="form-field">
                <input
                  matInput
                  [matDatepicker]="pickerFim"
                  id="dataFim"
                  formControlName="dataFim"
                  autocomplete="off"
                  placeholder="Selecione a data final"
                />
                <mat-datepicker-toggle matSuffix [for]="pickerFim"></mat-datepicker-toggle>
                <mat-datepicker #pickerFim></mat-datepicker>
              </mat-form-field>
            </div>

            <div class="filter-field">
              <mat-form-field appearance="outline" class="form-field">
                <input matInput id="pagadorFiltro" type="text" placeholder="Informe o nome da pessoa pagadora" formControlName="pagador" maxlength="80" />
              </mat-form-field>
            </div>

            <div class="filter-field">
              <mat-form-field appearance="outline" class="form-field">
                <input matInput id="recebedorFiltro" type="text" placeholder="Informe o nome da pessoa recebedora" formControlName="recebedor" maxlength="80" />
              </mat-form-field>
            </div>
          </div>

          <div class="filter-actions">
            <div class="actions-left">
              <button type="button" class="btn-custom btn-novo" (click)="novo()">Novo</button>
            </div>

            <div class="actions-right">
              <button type="button" class="btn-custom btn-limpar" (click)="limpar()">Limpar</button>
              <button type="button" class="btn-custom btn-pesquisar" (click)="pesquisar()">
                Pesquisar
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="result-card pagamentos-table" *ngIf="pagamentosFiltrados.length > 0">
      <div class="result-header">
        <div class="col data">Data</div>
        <div class="col valor">Valor</div>
        <div class="col pagador">Pagador</div>
        <div class="col recebedor">Recebedor</div>
        <div class="col grupo">Grupo</div>
        <div class="col acoes">Ações</div>
      </div>

      <div class="result-row" *ngFor="let pagamento of pagamentosFiltrados">
        <div class="col data">{{ pagamento.data }}</div>
        <div class="col valor">{{ pagamento.valor | currency: 'BRL' }}</div>
        <div class="col pagador">{{ pagamento.pagador }}</div>
        <div class="col recebedor">{{ pagamento.recebedor }}</div>
        <div class="col grupo">{{ pagamento.grupoNome || '-' }}</div>
        <div class="col acoes">
          <button mat-icon-button (click)="editar(pagamento)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="excluir(pagamento)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="sem-registros" *ngIf="!carregando && pagamentosFiltrados.length === 0">
      Nenhum pagamento encontrado.
    </div>
  </div>
</div>
