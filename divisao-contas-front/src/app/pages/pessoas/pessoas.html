<div class="page">
  <div class="page__container">
	<div class="card card-primary">
		<div class="card-header">{{ modoEdicao ? 'Alterar Pessoa' : 'Cadastrar Pessoas' }}</div>

		<div class="card-body">
			<form [formGroup]="form" (ngSubmit)="salvar()">
				<div class="form-row">
					<mat-form-field appearance="outline" class="form-field">
						<input matInput id="nomePessoa" placeholder="Informe o nome da Pessoa" formControlName="nome" maxlength="80" />
						<mat-hint align="end">{{ (form.get('nome')?.value?.length || 0) + '/80' }}</mat-hint>
						<mat-error *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
							O nome é obrigatório.
						</mat-error>
						<mat-error *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('minlength')">
							Informe pelo menos 2 caracteres.
						</mat-error>
					</mat-form-field>
				</div>

				<div class="card-actions">
					<button mat-raised-button color="warn" type="button" (click)="limpar()" [disabled]="salvando">
						Limpar
					</button>
					<button mat-raised-button color="primary" type="submit" [disabled]="salvando">
						{{ modoEdicao ? 'Atualizar' : 'Salvar' }}
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
