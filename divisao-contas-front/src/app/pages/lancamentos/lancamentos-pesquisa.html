<div class="page">
  <div class="page__container">
    <div class="card card-primary">
      <div class="card-header">Consultar Lançamentos</div>

      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="pesquisar()">
          <div class="filter-row">
            <div class="filter-field">
              <mat-form-field appearance="outline" class="form-field">
                <input
                  matInput
                  id="descricaoFiltro"
                  type="text"
                  formControlName="descricao"
                  autocomplete="off"
                  placeholder="Informe uma descrição"
                />
              </mat-form-field>
            </div>

            <div class="filter-field">
              <mat-form-field appearance="outline" class="form-field">
                <mat-label>Grupo</mat-label>
                <mat-select formControlName="grupoId" panelClass="pessoas-panel">
                  <mat-option [value]="null">Todos</mat-option>
                  <mat-option *ngFor="let g of grupos; trackBy: trackById" [value]="g.id">{{ g.nome }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <div class="filter-actions">
            <div class="actions-left">
              <button type="button" class="btn-custom btn-novo" (click)="novo()">
                Novo
              </button>
            </div>

            <div class="actions-right">
              <button type="button" class="btn-custom btn-limpar" (click)="limpar()" [disabled]="carregando">
                Limpar
              </button>
              <button type="button" class="btn-custom btn-pesquisar" (click)="pesquisar()" [disabled]="carregando">
                Pesquisar
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="result-card lancamentos-table" *ngIf="lancamentosFiltrados.length > 0">
      <div class="result-header">
        <div class="col data">Data</div>
        <div class="col pagador">Pagador</div>
        <div class="col valor">Valor</div>
        <div class="col descricao">Descrição</div>
        <div class="col grupo">Grupo</div>
        <div class="col acoes">Ações</div>
      </div>

      <div class="result-row" *ngFor="let l of lancamentosFiltrados; trackBy: trackById">
        <div class="col data">{{ l.data }}</div>
        <div class="col pagador">{{ l.pagador?.nome || '-' }}</div>
        <div class="col valor">{{ l.valor | currency: 'BRL' }}</div>
        <div class="col descricao">{{ l.descricao }}</div>
        <div class="col grupo">{{ l.grupoNome || '-' }}</div>

        <div class="col acoes">
          <button mat-icon-button (click)="editar(l)" [disabled]="carregando">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="excluir(l)" [disabled]="carregando">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="sem-registros" *ngIf="!carregando && lancamentosFiltrados.length === 0">
      Nenhum lançamento encontrado.
    </div>
  </div>
</div>
