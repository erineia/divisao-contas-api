<div class="page">
  <div class="breadcrumb">Pesquisar Grupos</div>

  <div class="card">
    <div class="card-header">Consultar Grupos</div>

    <div class="card-body">
      <form [formGroup]="form">
        <div class="filter-row">
          <div class="filter-field">
            <mat-form-field appearance="fill" class="form-field">
              <input matInput id="filtroNome" placeholder="Informe o nome do grupo" formControlName="nome" />
            </mat-form-field>
          </div>
        </div>

        <div class="filter-actions">
          <button mat-stroked-button color="basic" class="btn-novo" (click)="novo()">Novo</button>
          <button mat-raised-button color="warn" class="btn-limpar" (click)="limpar()">Limpar</button>
          <button mat-raised-button color="primary" class="btn-pesquisar" (click)="pesquisar()">Pesquisar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="result-card">
    <div class="result-header">
      <span>Nome do Grupo</span>
      <span class="result-actions-header"></span>
    </div>
    <div class="result-row" *ngFor="let grupo of gruposFiltrados">
      <span>{{ grupo.nome }}</span>
      <span class="result-actions">
        <button mat-icon-button color="primary" aria-label="Editar" class="icon-button" (click)="editar(grupo)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" aria-label="Excluir" class="icon-button" (click)="excluir(grupo)">
          <mat-icon>delete</mat-icon>
        </button>
      </span>
    </div>
  </div>
</div>
