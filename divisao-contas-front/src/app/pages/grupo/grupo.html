<div class="page">
	<div class="breadcrumb">Grupos &gt;&gt; {{ modoEdicao ? 'Alterar Grupo' : 'Cadastrar Grupo' }}</div>

	<div class="card">
		<div class="card-header">{{ modoEdicao ? 'Alterar Grupo' : 'Cadastrar Grupo' }}</div>

		<div class="card-body">
			<form [formGroup]="form" (ngSubmit)="salvar()">
				<div class="form-row">
					<label class="form-label" for="nomeGrupo">Nome Grupo</label>
					<mat-form-field appearance="fill" class="form-field">
						<input matInput id="nomeGrupo" placeholder="Nome do Grupo" formControlName="nome" />
						<mat-error *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
							O nome é obrigatório.
						</mat-error>
						<mat-error *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('minlength')">
							Informe pelo menos 2 caracteres.
						</mat-error>
					</mat-form-field>
				</div>

				<div class="card-actions">
					<button mat-raised-button color="warn" type="button" (click)="limpar()" [disabled]="salvando">
						Limpar
					</button>
					<button mat-raised-button color="primary" type="submit" [disabled]="salvando">
						{{ modoEdicao ? 'Atualizar' : 'Salvar' }}
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
