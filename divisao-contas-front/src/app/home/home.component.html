<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="isSmallScreen ? 'over' : 'side'"
    [opened]="false"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/home" (click)="closeIfSmall(sidenav)">Home</a>
      <a mat-list-item routerLink="/outra" (click)="closeIfSmall(sidenav)">Outra</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>

  <span>Divisão de Contas</span>
  <span class="spacer"></span>

  <span class="user-name">Neia</span>

  <button mat-icon-button (click)="logout()" aria-label="Sair">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>



    <main class="content">
      <h1>Teste</h1>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
